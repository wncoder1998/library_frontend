name: deploy

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: build
        run: pnpm install && pnpm run build

      - name: deploy
        run: |
          mkdir -p /home/wn/library
          rm -rf /home/wn/library/*
          cp -r dist/* /home/wn/library/
          echo "deploy done"
