name: deploy

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: [self-hosted, Linux, wn]

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install deps
        run: npm install

      - name: build
        run: npm run build

      - name: deploy to local folder
        run: |
          rm -rf /var/www/app/*
          cp -r dist/* /var/www/app/
          echo "deploy done"
